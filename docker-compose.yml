version: '3.8'

services:
  mongo:
    image: mongo:6
    container_name: pred_mongo
    restart: unless-stopped
    ports:
      - "27020:27017"
    volumes:
      - pred_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: pred_server
    restart: unless-stopped
    ports:
      - "5003:5003"
    environment:
      - PORT=5003
      - MONGO_URI=mongodb://mongo:27017/predictive_maintenance
    depends_on:
      mongo:
        condition: service_healthy

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: pred_client
    restart: unless-stopped
    ports:
      - "3003:80"
    depends_on:
      - server

volumes:
  pred_mongo_data:
